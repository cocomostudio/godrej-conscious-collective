#
# Installed by infra/install.js from
# infra/production/shared/nginx/forwarded-proto-map.conf.
#
# `X-Forwarded-Proto` cannot be `$scheme` here. TLS terminates at the load
# balancer, so the ALB reaches nginx over plain HTTP and `$scheme` is `http` on
# every request, including the ones the client made over HTTPS. Passing
# `$scheme` on tells the application every request was insecure — which is what
# decides `req.secure`, cookie flags, and any absolute URL the app builds.
#
# So: forward what the ALB said, and fall back to `$scheme` only when there is
# no ALB in front and nothing said anything.
#
# `map` is an `http`-level directive, so the file that includes this must do so
# OUTSIDE its server block.
#
# The variable is prefixed because this machine is shared. Two `map` blocks
# defining the same variable name at `http` level is not a last-one-wins; nginx
# refuses to start with "the duplicate variable", and the neighbour that also
# wanted a `$forwarded_proto` would take the whole box down with us.
#

map $http_x_forwarded_proto $gcc_forwarded_proto {
	default $http_x_forwarded_proto;
	""      $scheme;
}
