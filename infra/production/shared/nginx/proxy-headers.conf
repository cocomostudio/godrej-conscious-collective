#
# Installed by infra/install.js from
# infra/production/shared/nginx/proxy-headers.conf.
#
# The forwarding headers, in one place because both hosts must set them
# identically. This is not tidiness: the website reads `X-Forwarded-For` to
# decide who a caller is, and its `TRUST_PROXY` setting is only sound if the
# proxy in front of it is known to overwrite that header on every request. Two
# hand-maintained copies of this block is a rate limiter that stops limiting on
# whichever host drifts.
#
# `X-Forwarded-For` is appended to, not replaced: the ALB adds the client and
# nginx adds the ALB, so the application sees `<client>, <alb>` and has to be
# told there are two hops in front of it. That is `TRUST_PROXY=2` for the
# website and `server.proxy.maxIpsCount: 2` for the CMS. Change the number of
# proxies and both of those change with it.
#
# See the note on `TRUST_PROXY` in
# apps/website/src/infra/server/environment/index.ts.
#

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $gcc_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $gcc_connection_upgrade;
