#
# Installed by infra/install.js from
# infra/production/shared/nginx/websocket-upgrade-map.conf.
#
# `Connection` cannot be set to a constant. Sending `Connection: upgrade` on
# every request — which is what a bare `proxy_set_header Connection "upgrade"`
# does — announces an upgrade on ordinary requests that are not upgrading, and
# takes the connection out of keepalive to do it. The header has to follow the
# request: `upgrade` when the client asked for one, `close` when it did not.
#
# This is a `map`, so it belongs at `http` level. The file that includes it
# must therefore include it OUTSIDE its `server` block.
#
# The variable is prefixed because this machine is shared, and
# `$connection_upgrade` is the name every copy of this snippet on the
# internet uses. Two `map` blocks defining one variable makes nginx refuse to
# start — not silently pick one — so an unrelated application adopting the
# same canonical snippet would take the whole box down with us.
#

map $http_upgrade $gcc_connection_upgrade {
	default upgrade;
	""      close;
}
