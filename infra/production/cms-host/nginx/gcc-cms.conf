#
# Godrej Conscious Collective — the CMS host.
#
# Installed by infra/install.js to /etc/nginx/conf.d/gcc-cms.conf. Do not edit
# the installed copy; the next install overwrites it. The source of truth is
# infra/production/cms-host/nginx/gcc-cms.conf.
#
# The three values that vary by deployment — the host name, the port Strapi
# listens on, and nothing else — are not templated into this file. They are
# written as one-line fragments under /etc/nginx/gcc/ and included below, so
# what you read here is what nginx runs.
#

include /etc/nginx/gcc/websocket-upgrade-map.conf;
include /etc/nginx/gcc/forwarded-proto-map.conf;
# ↑ Both define an `http`-level variable, so both belong outside the server
# 	block below. $gcc_connection_upgrade is what Strapi's Transfer feature
# 	needs; $gcc_forwarded_proto is what carries the ALB's view of the scheme
# 	through to Strapi, which `$scheme` cannot do from behind a load balancer.

upstream gcc_cms {
	include /etc/nginx/gcc/cms-upstream.conf;
	# ↑ Generated: `server 127.0.0.1:<PORT>;` from CMS_PORT.
	#
	# 	No `keepalive` here on purpose. Upstream keepalive requires
	# 	`Connection ""`, which contradicts the upgrade handling that Strapi's
	# 	Transfer feature needs. On loopback the connection setup it would save
	# 	is not worth losing WebSocket support for.
}

server {
	listen 80;

	include /etc/nginx/gcc/cms-server-name.conf;
	# ↑ Generated: `server_name <HOST>;` from CMS_SERVER_NAME.
	#
	# 	Explicit, because unrelated applications share this machine. See the
	# 	note in infra/README.md on why `server_name _` was not that.

	server_tokens off;
	# ↑ Drops the version from the `Server` header and error pages.

	client_max_body_size 20m;
	# ↑ Matched to Strapi's own limit. `strapi::body` in
	# 	apps/cms/config/middlewares.ts caps a file at 20mb, so a larger one is
	# 	refused after nginx has streamed the whole of it across. Refusing it
	# 	here costs the uploader the same 413 at the first byte instead of the
	# 	last.

	client_body_timeout 60s;
	send_timeout        60s;
	keepalive_timeout   65s;
	# ↑ These three measure the gap between packets, not the length of a
	# 	request, so a slow upload is unaffected and a stalled one is dropped.
	# 	The long timeouts a large upload actually needs are the proxy_* pair
	# 	below.

	access_log /var/log/nginx/gcc-cms.access.log;
	error_log  /var/log/nginx/gcc-cms.error.log;

	location / {
		proxy_pass http://gcc_cms;
		include /etc/nginx/gcc/proxy-headers.conf;

		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
		# ↑ Strapi's Transfer feature holds one connection open for as long as
		# 	the transfer runs, and a large media library takes minutes. Nothing
		# 	else here is slow.
	}
}
