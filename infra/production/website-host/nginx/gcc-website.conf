#
# Godrej Conscious Collective — the website host.
#
# Installed by infra/install.js to /etc/nginx/conf.d/gcc-website.conf. Do not
# edit the installed copy; the next install overwrites it. The source of truth
# is infra/production/website-host/nginx/gcc-website.conf.
#

include /etc/nginx/gcc/websocket-upgrade-map.conf;
include /etc/nginx/gcc/forwarded-proto-map.conf;
# ↑ Both define an `http`-level variable, so both belong outside the server
# 	block below.
#
# 	Nothing here upgrades in production — React Router's HMR socket is a
# 	development-only thing — but the `Connection` header still has to be
# 	correct on the requests that do not upgrade, which is what that map is for.
# 	$gcc_forwarded_proto is what carries the ALB's view of the scheme through
# 	to the app; see the snippet for why `$scheme` cannot do it.

upstream gcc_website {
	include /etc/nginx/gcc/website-upstream.conf;
	# ↑ Generated: `server 127.0.0.1:<PORT>;` from WEBSITE_PORT.
}

server {
	listen 80;

	include /etc/nginx/gcc/website-server-name.conf;
	# ↑ Generated: `server_name <HOST>;` from WEBSITE_SERVER_NAME.

	server_tokens off;

	client_max_body_size 1m;
	# ↑ The registration form posts a small JSON body and nothing else here
	# 	accepts an upload.

	client_body_timeout 30s;
	send_timeout        30s;
	keepalive_timeout   65s;

	access_log /var/log/nginx/gcc-website.access.log;
	error_log  /var/log/nginx/gcc-website.error.log;

	gzip              on;
	gzip_vary         on;
	gzip_proxied      any;
	gzip_comp_level   5;
	gzip_min_length   1024;
	gzip_types        text/css text/plain text/javascript application/javascript
	                  application/json application/manifest+json image/svg+xml;
	# ↑ text/html is always compressed and cannot be listed. The Express server
	# 	in front of React Router sets no compression of its own, so without this
	# 	the HTML and the JS bundles go out uncompressed.

	add_header X-Content-Type-Options nosniff                     always;
	add_header Referrer-Policy        strict-origin-when-cross-origin always;
	include /etc/nginx/gcc/website-frame-ancestors.conf;
	# ↑ Generated: a Content-Security-Policy naming the CMS origin, from
	# 	CMS_ORIGIN.
	#
	# 	There is deliberately no `X-Frame-Options` here, and adding one would
	# 	break the CMS. Entry Preview is enabled in apps/cms/config/admin.ts and
	# 	the admin renders this site in an iframe; `DENY` or `SAMEORIGIN` refuses
	# 	that, and unlike the CSP it cannot name an allowed origin. The CSP's
	# 	`frame-ancestors` is the same protection expressed in a form that can.
	#
	# 	`add_header` at server level is discarded by any location that declares
	# 	one of its own. The location below does not — keep it that way, or
	# 	repeat the whole set inside it.

	location / {
		proxy_pass http://gcc_website;
		include /etc/nginx/gcc/proxy-headers.conf;

		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
	}
}
