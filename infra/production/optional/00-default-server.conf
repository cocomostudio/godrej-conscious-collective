#
# A catch-all default server. NOT installed by infra/install.js — read this
# through before you put it anywhere near a shared machine.
#
# nginx serves an unmatched Host header from the *default server* for that
# listening socket. Unless a block says `default_server`, the default is simply
# the first block nginx loaded for that address and port — and /etc/nginx/nginx.conf
# includes conf.d/*.conf in alphabetical order. So on a machine with unrelated
# applications, whichever config sorts first silently inherits every request
# for a host name nobody claimed: a stray DNS record, a scan on the public IP,
# a stale CNAME. `gcc-cms.conf` sorting before someone else's `zzz-app.conf` is
# the whole mechanism.
#
# Installing this file claims that role explicitly and answers with 444 — nginx's
# non-standard "close without a response" — so nothing is served by accident.
#
# Two ways it can go wrong, both on the OTHER applications sharing the machine:
#
#   1. If any existing block already declares `default_server` on :80, nginx
#      refuses to start with a duplicate. Check first:
#
#          grep -rn default_server /etc/nginx/
#
#   2. If another application was relying on being the accidental default — it
#      answers on the bare IP, or its `server_name` does not actually cover the
#      host name people reach it by — this takes that away and it starts
#      returning nothing. Confirm every neighbour has a real `server_name` that
#      matches how it is reached before installing.
#
# Install with:
#
#     sudo cp infra/production/optional/00-default-server.conf /etc/nginx/conf.d/
#     sudo nginx -t && sudo systemctl reload nginx
#
# The `00-` prefix is not what makes it the default — `default_server` is. It
# is there so a person reading conf.d/ sees it first.
#

server {
	listen 80 default_server;

	server_name _;
	# ↑ `_` is not a wildcard. It is simply a name no Host header can equal,
	# 	which is the conventional way of saying "this block is not here to match
	# 	by name". What makes this block catch unmatched traffic is
	# 	`default_server` above, and nothing else.

	server_tokens off;

	access_log /var/log/nginx/unmatched.access.log;

	return 444;
}
